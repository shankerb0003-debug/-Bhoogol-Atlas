name: Build Bhoogol Atlas Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Organize Android Folders Automatically
        run: |
          if [ ! -f app/build.gradle ]; then
            mkdir -p app/src/main/java/com/bhawanishankar/bhoogolatlas
            mkdir -p app/src/main/res/layout app/src/main/res/values app/src/main/assets
            [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
            [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/com/bhawanishankar/bhoogolatlas/
            [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/
            [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
            [ -f index.html ] && mv index.html app/src/main/assets/
            mkdir -p app/src/main/res/mipmap-xxxhdpi && [ -f ic_launcher.png ] && mv ic_launcher.png app/src/main/res/mipmap-xxxhdpi/
            [ -f proguard-rules.pro ] && mv proguard-rules.pro app/

            cat << 'GRADLE_ROOT' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          GRADLE_ROOT

            cat << 'GRADLE_APP' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.bhawanishankar.bhoogolatlas'
              compileSdk 35
              defaultConfig {
                  applicationId "com.bhawanishankar.bhoogolatlas"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'com.google.android.gms:play-services-ads:23.6.0'
          }
          GRADLE_APP
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release AAB, Release APK and Debug APK
        run: gradle bundleRelease assembleRelease assembleDebug --no-daemon

      - name: Sign Release APK
        run: |
          KEYSTORE_FILE="release-keystore.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -keyalg RSA -keysize 2048 -validity 10000 \
              -alias bhoogolatlas -storepass bhoogol123 -keypass bhoogol123 \
              -dname "CN=Bhawani Shankar, O=Bhoogol Atlas, L=Suratgarh, ST=Rajasthan, C=IN"
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          UNSIGNED_APK=$(ls app/build/outputs/apk/release/*-unsigned.apk | head -n 1)
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE_FILE" --ks-key-alias bhoogolatlas \
            --ks-pass pass:bhoogol123 --key-pass pass:bhoogol123 \
            --out app/build/outputs/apk/release/BhoogolAtlas-release.apk app-release-aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BhoogolAtlas-PlayStore-AAB
          path: app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: BhoogolAtlas-Release-APK
          path: app/build/outputs/apk/release/BhoogolAtlas-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BhoogolAtlas-Test-APK
          path: app/build/outputs/apk/debug/*.apk
          
